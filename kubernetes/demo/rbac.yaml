# Read-only viewer for the demo namespace: can see pods, services and deployments;
# cannot change anything, read Secrets, or see other namespaces.
# Test: kubectl get pods -n airgap-demo --as=system:serviceaccount:airgap-demo:demo-viewer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-viewer
  namespace: airgap-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
  namespace: airgap-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-viewer-binding
  namespace: airgap-demo
subjects:
  - kind: ServiceAccount
    name: demo-viewer
    namespace: airgap-demo
roleRef:
  kind: Role
  name: viewer
  apiGroup: rbac.authorization.k8s.io
