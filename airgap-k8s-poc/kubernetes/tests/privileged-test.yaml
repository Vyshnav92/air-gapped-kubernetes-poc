# Pod Security test: must be REJECTED in the 'default' namespace (enforce=baseline).
apiVersion: v1
kind: Pod
metadata:
  name: privileged-test
  namespace: default
spec:
  containers:
    - name: test
      image: bastion-mirror:5000/busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
