# Air-gap proof app: checks every 30s whether the internet is reachable from inside
# the cluster, and serves the result on NodePort 30090.
# Namespace enforces Pod Security "restricted"; the pod runs non-root, read-only, no API token.
apiVersion: v1
kind: Namespace
metadata:
  name: airgap-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airgap-proof
  namespace: airgap-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airgap-proof
  template:
    metadata:
      labels:
        app: airgap-proof
    spec:
      automountServiceAccountToken: false
      containers:
        - name: proof
          image: bastion-mirror:5000/busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              httpd -p 8080 -h /www
              while true; do
                {
                  echo "=== AIR-GAP STATUS ==="
                  echo "Pod:  $(hostname)"
                  echo "Time: $(date)"
                  echo ""
                  echo "--- Outside world (must be BLOCKED) ---"
                  if nslookup google.com >/dev/null 2>&1; then echo "google.com            REACHABLE (BAD)"; else echo "google.com            BLOCKED"; fi
                  if nslookup registry-1.docker.io >/dev/null 2>&1; then echo "registry-1.docker.io  REACHABLE (BAD)"; else echo "registry-1.docker.io  BLOCKED"; fi
                  if wget -q -T 3 -O /dev/null http://1.1.1.1; then echo "1.1.1.1 (raw IP)      REACHABLE (BAD)"; else echo "1.1.1.1 (raw IP)      BLOCKED"; fi
                  echo ""
                  echo "--- Inside the cluster (must be OK) ---"
                  if nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1; then echo "cluster DNS           OK"; else echo "cluster DNS           FAILED"; fi
                } > /www/index.html
                sleep 30
              done
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airgap-proof
  namespace: airgap-demo
spec:
  type: NodePort
  selector:
    app: airgap-proof
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
