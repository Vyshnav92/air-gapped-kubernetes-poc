# Encryption of Secrets at rest. TEMPLATE ONLY: the real file holds the key and is never committed.
#
# On k8s-cp-01:
#   head -c 32 /dev/urandom | base64          # generate the key
#   /etc/kubernetes/enc/encryption-config.yaml # this file, with the key, chmod 600
#
# In /etc/kubernetes/manifests/kube-apiserver.yaml add:
#   command:       - --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
#   volumeMounts:  - mountPath: /etc/kubernetes/enc
#                    name: enc
#                    readOnly: true
#   volumes:       - hostPath:
#                      path: /etc/kubernetes/enc
#                      type: DirectoryOrCreate
#                    name: enc
#
# Then re-encrypt existing Secrets:  kubectl get secrets -A -o json | kubectl replace -f -
# Back up the key separately from etcd backups. Lose the key = lose every Secret.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - secretbox:
          keys:
            - name: key1
              secret: REPLACE-WITH-BASE64-32-BYTE-KEY
      - identity: {}
