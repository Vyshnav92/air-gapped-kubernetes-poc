# /etc/dnsmasq.d/lab.conf on bastion-mirror
# Internal DNS for the lab. no-resolv = no upstream servers, so every external
# name is refused instantly (no lookup ever leaves the network).
listen-address=192.168.50.10
bind-interfaces
no-resolv
no-hosts
log-queries
host-record=bastion-mirror,bastion-mirror.lab.home.arpa,192.168.50.10
host-record=k8s-cp-01,k8s-cp-01.lab.home.arpa,192.168.50.11
host-record=k8s-worker-01,k8s-worker-01.lab.home.arpa,192.168.50.12
host-record=k8s-worker-02,k8s-worker-02.lab.home.arpa,192.168.50.13
