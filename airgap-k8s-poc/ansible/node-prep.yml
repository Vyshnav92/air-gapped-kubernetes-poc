- name: Prepare Kubernetes nodes
  hosts: k8s
  become: true
  tasks:

    # ---------- 1. apt: bastion repo only ----------
    - name: Disable Ubuntu internet sources
      ansible.builtin.command: mv /etc/apt/sources.list /etc/apt/sources.list.disabled
      args:
        removes: /etc/apt/sources.list

    - name: Use the bastion repo only
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/airgap.list
        content: "deb [trusted=yes] http://bastion-mirror/repo ./\n"

    - name: apt - no translation files
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99no-translations
        content: "Acquire::Languages \"none\";\n"

    - name: apt - ask for .gz first
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99gz-first
        content: "Acquire::CompressionTypes::Order:: \"gz\";\n"

    # ---------- 2. silence phone-home services ----------
    - name: Remove phone-home packages
      ansible.builtin.apt:
        name: [snapd, unattended-upgrades]
        state: absent
        purge: true

    - name: Disable phone-home timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - motd-news.timer
        - update-notifier-download.timer
        - update-notifier-motd.timer

    # ---------- 3. swap off ----------
    - name: Turn swap off now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Keep swap off after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    # ---------- 4. kernel modules ----------
    - name: Load modules on every boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load modules now
      community.general.modprobe:
        name: "{{ item }}"
      loop: [overlay, br_netfilter]

    # ---------- 5. sysctl ----------
    - name: Kernel settings for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      register: sysctl_file

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      when: sysctl_file.changed

    # ---------- 6. trust our Root CA ----------
    - name: Add our CA to the OS trust store
      ansible.builtin.copy:
        src: /srv/airgap/pki/ca.crt
        dest: /usr/local/share/ca-certificates/airgap-lab-ca.crt
      notify: update CA trust

    # ---------- 7. Kubernetes packages ----------
    - name: Install container runtime and Kubernetes tools
      ansible.builtin.apt:
        name:
          - containerd.io
          - kubelet
          - kubeadm
          - kubectl
          - socat
          - conntrack
          - ebtables
        update_cache: true

    - name: Hold versions (no accidental upgrades)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [containerd.io, kubelet, kubeadm, kubectl]

    # ---------- 8. time sync from the bastion ----------
    - name: Install chrony
      ansible.builtin.apt:
        name: chrony

    - name: Remove internet time servers
      ansible.builtin.replace:
        path: /etc/chrony/chrony.conf
        regexp: '^pool'
        replace: '#pool'
      notify: restart chrony

    - name: Use the bastion as time server
      ansible.builtin.copy:
        dest: /etc/chrony/conf.d/bastion.conf
        content: "server bastion-mirror iburst\n"
      notify: restart chrony

  handlers:
    - name: update CA trust
      ansible.builtin.command: update-ca-certificates

    - name: restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted
