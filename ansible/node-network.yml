# Air-gap network fixes. The nodes have NO default route (by design), so:
#  - kubelet cannot auto-detect its node IP  -> set --node-ip explicitly
#  - Service IPs (10.96.0.0/12) have no route -> add a route for that range only
#  - Calico pods use 169.254.1.1 as gateway and need proxy ARP, which only answers
#    for routed addresses -> add a /32 route for it
# No default route is added, so all external traffic stays unreachable.
- name: Air-gap network fixes for Kubernetes
  hosts: k8s
  become: true
  tasks:

    - name: Routes for the Service network and Calico's pod gateway
      ansible.builtin.copy:
        dest: /etc/netplan/60-k8s-services.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              eth0:
                routes:
                  - to: 10.96.0.0/12
                    scope: link
                  - to: 169.254.1.1/32
                    scope: link
      notify: apply netplan

    - name: Tell kubelet its own IP
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: "KUBELET_EXTRA_ARGS=--node-ip={{ ansible_eth0.ipv4.address }}\n"
      notify: restart kubelet

  handlers:
    - name: apply netplan
      ansible.builtin.command: netplan apply

    - name: restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
